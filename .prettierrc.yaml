# https://prettier.io/docs/en/options.html

# 单参数箭头函数始终带括号
arrowParens: "always"
# JSX 多行元素闭合标签另起一行
bracketSameLine: false
# 对象字面量花括号内保留空格
bracketSpacing: true
# 自动格式化嵌入的代码块
embeddedLanguageFormatting: "auto"
# HTML 空白不敏感
htmlWhitespaceSensitivity: "ignore"
# 不插入 @prettier pragma
insertPragma: false
# JSX 使用双引号
jsxSingleQuote: false
# 每行最大长度
printWidth: 100
# Markdown 保留原有换行
proseWrap: "preserve"
# 仅在必要时给对象属性加引号
quoteProps: "as-needed"
# 不要求文件顶部有 @prettier pragma
requirePragma: false
# 语句末尾加分号
semi: true
# 使用双引号
singleQuote: false
# 缩进 2 空格
tabWidth: 2
# 多行末尾逗号（ES5）
trailingComma: "es5"
# 使用空格缩进
useTabs: false
# Vue 的 <script>/<style> 不额外缩进
vueIndentScriptAndStyle: false
# 自动检测换行符
endOfLine: "auto"

# HTML 文件使用 html 解析器
overrides:
  - files: "*.html"
    options:
      parser: "html"
